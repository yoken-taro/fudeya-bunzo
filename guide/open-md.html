<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://fudeya-bunzo.com/guide/open-md">

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e8;color:#1f1b16;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
main{max-width:34rem;margin:2rem;padding:2.5rem 2rem;background:#fffdf8;border:1px solid #d8cfbf;border-radius:6px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}

.url{font-family:Consolas,monospace;font-size:.95rem;word-break:break-all}.small{font-size:.85rem;color:#6b6257}</style></head>
<body><main>
<div class="seal">文</div>
<h1>筆屋文蔵の公式サイトは移転しました</h1>
<p>いつもご覧いただきありがとうございます。<br>公式サイトは、新しいアドレスに引っ越しました。</p>
<p class="url" id="u">https://fudeya-bunzo.com/guide/open-md</p>
<p class="small">新しいサイトの「MDファイルの開き方」へ自動で移動します。<br>ブックマークの登録先も、新しいアドレスへの変更をお願いします。</p>
<a class="go" id="go" href="https://fudeya-bunzo.com/guide/open-md">新しいサイトへ移動する →</a>
</main><script>(function(){var m={'':'/','index.html':'/','manual.html':'/manual','manual':'/manual'};
var p=location.pathname.replace(/^\/fudeya-bunzo\/?/,'');var d=m[p];
if(!d){d='/'+p.replace(/\.html$/,'').replace(/\/index$/,'/');}
var u='https://fudeya-bunzo.com'+d+location.search+location.hash;
var a=document.getElementById('go');a.href=u;document.getElementById('u').textContent=u;
location.replace(u);})();</script></body></html>
